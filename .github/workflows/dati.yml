name: Aggiorna dati di mercato
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENABLE_DATAROMA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy openpyxl requests beautifulsoup4
      - run: python aggiorna_dati.py
      - name: Salva i dati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dati
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna dati"
          git pull --rebase
          git push
